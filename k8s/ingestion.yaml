apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      containers:
        - name: ingestion
          image: event-telemetry-pipeline-ingestion:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
            - containerPort: 2112
          env:
            - name: REDIS_ADDR
              value: redis:6379
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion
spec:
  selector:
    app: ingestion
  ports:
    - name: simulator
      port: 9000
      targetPort: 9000
    - name: metrics
      port: 2112
      targetPort: 2112
